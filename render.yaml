services:
  - type: web
    name: anquandian
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GEMINI_API_KEY
        sync: false
      - key: INVITE_CODES
        sync: false
      - key: ACCESS_COOKIE_SECRET
        generateValue: true
      - key: APP_URL
        sync: false
